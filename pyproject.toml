[project]
name = "quant-per"
version = "0.1.0"
description = "KOSPI/KOSDAQ 가치지표(PER) 기반 퀀트 매매전략"

requires-python = ">=3.10"

# 메인 실행에 필요한 필수 패키지 목록
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pykrx>=1.2.8",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=14.0.0",
]

# 패키징 빌드 시스템 (uv의 기본값인 hatchling 사용)
#[build-system]
#requires = ["hatchling"]
#build-backend = "hatchling.build"

# 개발 환경에서만 사용하는 추가 패키지 (선택 사항)
[dependency-groups]
dev = [
    "pytest>=8.0.0",   # 단위 테스트용
    "ruff>=0.3.0",     # 코드 포매팅 및 린팅 (빠르고 강력함)
]

# ruff 설정 (옵션: 한국어 주석 및 코드 스타일에 맞춘 포매터 설정)
[tool.ruff]
line-length = 88
indent-width = 4
